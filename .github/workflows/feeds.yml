name: Build RSS feeds

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 minutes, off the busy top of the hour
  workflow_dispatch:             # adds a "Run workflow" button
  push:
    paths: ["sites.yaml", "scrape.py", "watch.yaml", "watch.py"]

permissions:
  contents: write

concurrency:
  group: feeds          # never run two builds at once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/feeds.yml
      - run: pip install requests beautifulsoup4 pyyaml feedparser
      - run: python scrape.py
      - run: python watch.py   # merged, topic-filtered competitor list
        if: always()
      - name: Save changed feeds
        id: save
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs cache
          if git diff --cached --quiet; then
            echo "changed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update feeds"
          # Another save can land while this build runs. Rebase onto it and retry,
          # keeping this build's newer feed files. If it still will not go, skip:
          # the next build, 10 minutes later, regenerates everything anyway.
          for i in 1 2 3; do
            git push && break
            if [ "$i" = 3 ]; then
              echo "::warning::Push still rejected after 3 tries; skipping, next build will catch up"
              echo "changed=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 5))
            git fetch -q origin main
            git rebase -X theirs origin/main || { git rebase --abort; git reset -q --hard origin/main; echo "changed=" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo "changed=$(git diff --name-only HEAD~1 HEAD -- 'docs/*.xml' | xargs)" >> "$GITHUB_OUTPUT"
      - name: Tell Inoreader there are new stories
        if: steps.save.outputs.changed != ''
        run: |
          sleep 75   # give GitHub Pages time to publish the new version first
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner,,}.github.io/${repo}/"
          [ "${repo,,}" = "${owner,,}.github.io" ] && base="https://${owner,,}.github.io/"
          for f in ${{ steps.save.outputs.changed }}; do
            url="${base}$(basename "$f")"
            curl -s -o /dev/null -w "ping $url -> %{http_code}\n" \
              -d hub.mode=publish --data-urlencode "hub.url=$url" \
              https://pubsubhubbub.appspot.com/ || true
          done
